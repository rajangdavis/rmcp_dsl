openapi: 3.1.0
info:
  title: Shop
  version: "2"
paths:
  /items/{id}:
    get:
      operationId: GetItem
      summary: One item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: id
          in: query
          schema: { type: string }
        - name: fields
          in: query
          schema:
            type: array
            items: { type: integer }
            minItems: 1
        - name: price
          in: query
          schema: { type: number, exclusiveMinimum: 0, minimum: 0 }
        - name: type
          in: query
          schema: { type: ["string", "null"] }
      responses:
        "200": { description: ok }
